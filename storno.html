<!Doctype html>
<html>
<head>
	<title>Termin stornieren</title>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			background-color: #f5f5f5;
		}
		.container {
			text-align: center;
			background: white;
			padding: 30px;
			border-radius: 12px;
			box-shadow: 0 4px 10px rgba(0,0,0,0,1);
			max-width: 90%;
		}

		h2 {
			margin-bottom: 20px;
		}
		button {
			padding: 15px 25px;
			font-size: 18px;
			border: none;
			border-radius: 8px;
			background-color: #e74c3c;
			color: white;
			cursor: pointer;
		}
		button:active {
			background-color: #c0392b;
		}
	</style>
</head>
<body>
<div class="container">
	<h2>Termin stornieren</h2>
	<p id="info">Lade...</p>

	<button onclick="stornieren()">Termin stornieren</button>
</div>

<script>
	const params = new URLSearchParams(window.location.search);
	const token = params.get("token");

	if (token) {
		document.getElementById("info").innerText =
			"Möchten Sie den Termin wirklich stronieren?";
	} else {
		document.getElementById("info").innerText =
			"Kein gültiger Link";
	}

	async function stornieren() {
		if (!token) return;

		await fetch("/api/storno", {
			method: "POST",
			headers: {
				"Content-Type": "application/json"
			},
			body: JSON.stringify({ token: token })
		});
		document.body.innerHTML = "<h2 style='text-align:center;'>Termin wurde storniert</h2>";
	}
</script>

</body>
</html>
